<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOTYPE — Onboarding Wizard (3 variants)</title>
<!--
  PROTOTYPE — THROWAWAY CODE. Wayfinder ticket T10.
  Question: what does a setup flow look like that a non-technical F&B owner
  finishes — through to a test member enrolled via QR — in under 15 minutes?
  Three variants, switch with the bottom bar, ← → keys, or ?variant=A|B|C.
  No persistence. No error handling. Delete or absorb when answered.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#22263F; --paper:#FBF8F1; --kaya:#FFC844; --pandan:#2EAF9B;
  --sambal:#FF6B5E; --line:#22263F; --soft:#EFE9DC; --white:#FFFFFF;
  --doodle:'Caveat',cursive; --body:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);min-height:100vh}
button{font-family:var(--body);cursor:pointer}
input,select{font-family:var(--body);font-size:16px}

/* signature: hand-drawn wobble */
.wob{border:2.5px solid var(--line);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;background:var(--white)}
.wob2{border:2.5px solid var(--line);border-radius:15px 255px 15px 225px/225px 15px 255px 15px;background:var(--white)}
.doodle{font-family:var(--doodle);font-weight:700}
.btn{border:2.5px solid var(--line);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  background:var(--kaya);padding:12px 22px;font-weight:800;font-size:15px;color:var(--ink);
  box-shadow:3px 3px 0 var(--line);transition:transform .08s}
.btn:hover{transform:translate(-1px,-1px)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
.btn.ghost{background:var(--white)}
.btn.go{background:var(--pandan);color:var(--white)}
.field{display:block;margin-bottom:14px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 13px;border:2.5px solid var(--line);
  border-radius:12px 4px 12px 4px;background:var(--white)}
.field input:focus,.field select:focus{outline:3px solid var(--kaya)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:2px solid var(--line);border-radius:999px;background:var(--white);padding:7px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--white)}
.swatches{display:flex;gap:10px;margin-top:6px}
.swatch{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--line);cursor:pointer}
.swatch.on{outline:3.5px solid var(--ink);outline-offset:2px}
.covers{display:flex;gap:10px;margin-top:6px}
.cover{width:72px;height:46px;border:2.5px solid var(--line);border-radius:10px;cursor:pointer;font-size:22px;
  display:flex;align-items:center;justify-content:center;background:var(--white)}
.cover.on{outline:3.5px solid var(--ink);outline-offset:2px}
.logos{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.logo-pick{width:44px;height:44px;border:2.5px solid var(--line);border-radius:50%;font-size:20px;
  background:var(--white);display:flex;align-items:center;justify-content:center}
.logo-pick.on{outline:3.5px solid var(--ink);outline-offset:2px}

/* timer chip */
#timer{position:fixed;top:12px;right:12px;z-index:50;background:var(--white);border:2.5px solid var(--line);
  border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;box-shadow:3px 3px 0 var(--line)}
#timer span{color:var(--pandan)}

/* member card preview */
.mcard{width:100%;max-width:340px;border:2.5px solid var(--line);border-radius:22px 8px 22px 8px;
  overflow:hidden;background:var(--white);box-shadow:5px 5px 0 var(--line)}
.mcard .cov{height:86px;display:flex;align-items:center;justify-content:center;font-size:34px;border-bottom:2.5px solid var(--line)}
.mcard .bod{padding:16px}
.mcard .lg{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--line);background:var(--white);
  display:flex;align-items:center;justify-content:center;font-size:24px;margin-top:-44px;margin-bottom:8px}
.mcard h3{font-size:19px;font-weight:800}
.mcard .tier{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800;
  border:2px solid var(--line)}
.mcard .pts{margin-top:12px;font-size:13px;color:#555}
.mcard .rw{margin-top:10px;padding:10px;border:2px dashed var(--line);border-radius:12px;font-size:13px;font-weight:600;background:var(--paper)}
.doodle-note{font-family:var(--doodle);font-size:19px;color:var(--sambal);line-height:1.1}

/* ============ VARIANT A: checklist + canvas ============ */
#vA{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
#vA .side{border-right:2.5px solid var(--line);padding:26px 22px;background:var(--white)}
#vA .brand{font-size:22px;font-weight:800;margin-bottom:4px}
#vA .brand .doodle{color:var(--pandan);font-size:26px}
#vA .sub{font-size:13px;color:#666;margin-bottom:22px}
#vA .check{list-style:none}
#vA .check li{display:flex;gap:12px;align-items:flex-start;padding:13px 12px;border-radius:14px;margin-bottom:6px;cursor:pointer}
#vA .check li.cur{background:var(--paper);border:2px solid var(--line)}
#vA .tick{width:26px;height:26px;flex:none;border:2.5px solid var(--line);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:var(--white)}
#vA .check li.done .tick{background:var(--pandan);color:#fff}
#vA .check li b{display:block;font-size:14px}
#vA .check li small{font-size:12px;color:#777}
#vA .prog{margin-top:18px;font-size:12px;font-weight:700}
#vA .bar{height:12px;border:2.5px solid var(--line);border-radius:999px;margin-top:6px;overflow:hidden;background:var(--white)}
#vA .bar i{display:block;height:100%;background:var(--kaya);transition:width .3s}
#vA .main{display:grid;grid-template-columns:1fr 380px;gap:28px;padding:34px 32px;align-items:start}
#vA .panel{padding:24px}
#vA .panel h2{font-size:23px;font-weight:800;margin-bottom:4px}
#vA .panel .hint{font-size:13px;color:#666;margin-bottom:18px}
#vA .prevwrap{position:sticky;top:24px;text-align:center}
#vA .prevnote{margin-bottom:6px;transform:rotate(-2deg)}
@media(max-width:960px){
  #vA{grid-template-columns:1fr}
  #vA .side{border-right:none;border-bottom:2.5px solid var(--line);padding:16px}
  #vA .check{display:flex;overflow-x:auto;gap:6px}
  #vA .check li{flex:none;padding:8px 10px}
  #vA .check li small{display:none}
  #vA .main{grid-template-columns:1fr;padding:18px}
  #vA .prevwrap{position:static}
}

/* ============ VARIANT B: one thing at a time ============ */
#vB{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 18px 120px;text-align:center}
#vB .stepno{font-family:var(--doodle);font-size:24px;color:var(--sambal);transform:rotate(-2deg)}
#vB h1{font-size:clamp(26px,5vw,42px);font-weight:800;max-width:640px;margin:8px auto 6px;line-height:1.15}
#vB .hint{font-size:15px;color:#666;max-width:520px;margin:0 auto 26px}
#vB .stage{width:100%;max-width:480px;text-align:left}
#vB .dots{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
#vB .dot{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--line);background:var(--white)}
#vB .dot.done{background:var(--pandan)} #vB .dot.cur{background:var(--kaya)}
#vB .navrow{display:flex;gap:10px;justify-content:center;margin-top:26px}

/* ============ VARIANT C: fill the card ============ */
#vC{min-height:100vh;padding:40px 18px 140px;display:flex;flex-direction:column;align-items:center}
#vC h1{font-size:clamp(24px,4.5vw,36px);font-weight:800;text-align:center}
#vC .lead{font-size:15px;color:#666;text-align:center;margin:6px 0 30px;max-width:560px}
#vC .canvas{position:relative;width:100%;max-width:760px;display:flex;justify-content:center}
#vC .bigcard{width:100%;max-width:420px;border:2.5px solid var(--line);border-radius:26px 10px 26px 10px;background:var(--white);
  box-shadow:6px 6px 0 var(--line);overflow:hidden}
#vC .bigcard .cov{height:110px;border-bottom:2.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:42px;cursor:pointer}
#vC .bigcard .bod{padding:20px}
#vC .bigcard .lg{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--line);background:var(--white);font-size:30px;
  display:flex;align-items:center;justify-content:center;margin-top:-56px;cursor:pointer}
#vC .inline{border:none;border-bottom:2.5px dashed var(--line);background:transparent;font-weight:800;width:100%;padding:4px 2px}
#vC .inline:focus{outline:none;border-bottom-color:var(--pandan)}
#vC .nm{font-size:22px}
#vC .row{display:flex;gap:10px;align-items:center;margin-top:14px}
#vC .row .lab{font-size:12px;font-weight:700;color:#777;flex:none;width:92px}
#vC .ann{position:absolute;font-family:var(--doodle);font-size:20px;color:var(--sambal);max-width:170px;line-height:1.05}
#vC .ann svg{display:block}
#vC .ann.a1{top:-8px;left:calc(50% + 230px)}
#vC .ann.a2{top:120px;left:calc(50% - 400px);text-align:right}
#vC .ann.a3{top:300px;left:calc(50% + 240px)}
@media(max-width:900px){#vC .ann{display:none}}
#vC .gorow{margin-top:30px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}

/* ============ go-live / scan / portal / done (shared) ============ */
.live{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 18px 130px;text-align:center}
.live h1{font-size:clamp(26px,5vw,40px);font-weight:800;margin-bottom:6px}
.live p{color:#666;max-width:480px;margin:0 auto 24px;font-size:15px}
.qrbox{padding:22px;display:inline-block}
.qrbox svg{display:block}
.qrname{font-weight:800;margin-top:10px}
.portal{max-width:380px;width:100%;margin:0 auto;text-align:left}
.phone{border:2.5px solid var(--line);border-radius:34px;padding:14px;background:var(--white);box-shadow:6px 6px 0 var(--line)}
.confetti{font-size:52px}
.bigtime{font-size:44px;font-weight:800;color:var(--pandan)}
.notch{width:90px;height:8px;border-radius:99px;background:var(--soft);margin:0 auto 10px}

/* ============ switcher ============ */
#switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;
  padding:8px 12px;box-shadow:0 6px 18px rgba(0,0,0,.3);font-size:13px;font-weight:700}
#switcher button{background:#fff;color:var(--ink);border:none;border-radius:50%;width:30px;height:30px;font-size:15px;font-weight:800}
#switcher .lbl{min-width:210px;text-align:center}
#switcher .tag{background:var(--sambal);border-radius:6px;padding:1px 6px;margin-right:6px;font-size:10px;letter-spacing:.5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="timer">⏱ <span id="tval">0:00</span> · target 15:00</div>
<div id="app"></div>

<div id="switcher">
  <button id="prev" aria-label="Previous variant">←</button>
  <div class="lbl"><span class="tag">PROTOTYPE</span><span id="vlabel"></span></div>
  <button id="next" aria-label="Next variant">→</button>
</div>

<script>
/* ------------ shared state (in memory only) ------------ */
const S = {
  step: 0, // 0..3 config steps, 4 = QR, 5 = portal, 6 = done
  bizName: '', bizType: 'Cafe',
  logo: '☕', color: '#2EAF9B', cover: '🥐',
  tierName: 'Kopi Club', earn: 1,
  rewardName: 'Free kopi', rewardPts: 100,
  startedAt: null, doneAt: null
};
const COLORS = ['#2EAF9B','#FF6B5E','#FFC844','#7A5CFA','#22263F'];
const COVERS = ['🥐','🍜','🧋','🍰','🍢'];
const LOGOS = ['☕','🥟','🍞','🌶️','🫖','🍧'];
const TIER_TPL = ['Kopi Club','Makan Gang','VIP Regulars'];
const RW_TPL = [['Free kopi',100],['RM5 voucher',150],['Birthday dessert',0]];

const STEPS = [
  {t:'Your business', s:'Tell us who you are', icon:'1'},
  {t:'Make it yours', s:'Logo, colour, cover', icon:'2'},
  {t:'First tier', s:'Name it, set earning', icon:'3'},
  {t:'First reward', s:'What members unlock', icon:'4'},
  {t:'Go live', s:'Scan & enrol yourself', icon:'★'}
];

/* ------------ timer ------------ */
function tickTimer(){
  if(!S.startedAt) return;
  const end = S.doneAt || Date.now();
  const s = Math.floor((end - S.startedAt)/1000);
  document.getElementById('tval').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
setInterval(tickTimer, 500);
function startClock(){ if(!S.startedAt) S.startedAt = Date.now(); }

/* ------------ tiny helpers ------------ */
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function set(k,v){ S[k]=v; startClock(); render(); }
function bindInputs(root){
  root.querySelectorAll('[data-k]').forEach(el=>{
    el.addEventListener('input', e=>{ S[el.dataset.k] = el.type==='number'? +el.value : el.value; startClock(); syncPreviews(); });
  });
}

/* fake QR (prototype only) */
function qrSVG(size){
  let cells='';
  let seed=7;
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){
    if((x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13)) continue;
    seed=(seed*73+13)%97;
    if(seed%2) cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="none" stroke="#22263F" stroke-width="1.4"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg width="${size}" height="${size}" viewBox="-1 -1 23 23" fill="#22263F">${finder(0,0)}${finder(14,0)}${finder(0,14)}${cells}</svg>`;
}

/* member card / portal markup from state */
function cardHTML(compact){
  return `<div class="mcard" style="margin:0 auto">
    <div class="cov" style="background:${S.color}22">${S.cover}</div>
    <div class="bod">
      <div class="lg">${S.logo}</div>
      <h3>${esc(S.bizName)||'<span style="color:#bbb">Your business name</span>'}</h3>
      <span class="tier" style="background:${S.color};color:#fff">${esc(S.tierName)||'Tier name'}</span>
      <div class="pts">Earn <b>${S.earn} pt</b> per RM1 spent</div>
      <div class="rw">🎁 ${esc(S.rewardName)||'Your first reward'} — <b>${S.rewardPts>0? S.rewardPts+' pts':'on birthday'}</b></div>
      ${compact?'':'<div style="margin-top:12px;font-size:11px;color:#999;text-align:center">members.yourplatform.my/'+(esc(S.bizName)||'you').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'</div>'}
    </div></div>`;
}
function syncPreviews(){ document.querySelectorAll('.livepreview').forEach(p=>p.innerHTML=cardHTML(false)); }

/* ------------ step form fragments (shared fields, laid out per variant) ------------ */
function stepFields(i){
  if(i===0) return `
    <div class="field"><label>Business name</label>
      <input data-k="bizName" value="${esc(S.bizName)}" placeholder="e.g. Kopi Corner PJ" autofocus></div>
    <div class="field"><label>What kind of place?</label>
      <div class="chips">${['Cafe','Restaurant','Bakery','Dessert shop'].map(t=>
        `<button class="chip ${S.bizType===t?'on':''}" onclick="set('bizType','${t}')">${t}</button>`).join('')}</div></div>`;
  if(i===1) return `
    <div class="field"><label>Pick a logo (upload later — tap one for now)</label>
      <div class="logos">${LOGOS.map(l=>`<button class="logo-pick ${S.logo===l?'on':''}" onclick="set('logo','${l}')">${l}</button>`).join('')}</div></div>
    <div class="field"><label>Brand colour</label>
      <div class="swatches">${COLORS.map(c=>`<button class="swatch ${S.color===c?'on':''}" style="background:${c}" onclick="set('color','${c}')" aria-label="${c}"></button>`).join('')}</div></div>
    <div class="field"><label>Cover vibe</label>
      <div class="covers">${COVERS.map(c=>`<button class="cover ${S.cover===c?'on':''}" onclick="set('cover','${c}')">${c}</button>`).join('')}</div></div>`;
  if(i===2) return `
    <div class="field"><label>Tier name — steal one of ours</label>
      <div class="chips">${TIER_TPL.map(t=>`<button class="chip ${S.tierName===t?'on':''}" onclick="set('tierName','${t}')">${t}</button>`).join('')}</div>
      <input style="margin-top:8px" data-k="tierName" value="${esc(S.tierName)}" placeholder="or type your own"></div>
    <div class="field"><label>Points per RM1 spent</label>
      <input type="number" min="1" data-k="earn" value="${S.earn}"></div>`;
  if(i===3) return `
    <div class="field"><label>First reward — F&amp;B favourites</label>
      <div class="chips">${RW_TPL.map(([n,p])=>`<button class="chip ${S.rewardName===n?'on':''}" onclick="set('rewardName','${n}');set('rewardPts',${p})">${n}</button>`).join('')}</div>
      <input style="margin-top:8px" data-k="rewardName" value="${esc(S.rewardName)}"></div>
    <div class="field"><label>Points needed</label>
      <input type="number" min="0" data-k="rewardPts" value="${S.rewardPts}"><small style="color:#888">0 = birthday-triggered</small></div>`;
  return '';
}

/* ------------ go-live sequence, shared by all variants ------------ */
function liveHTML(){
  if(S.step===4) return `<div class="live">
      <div class="doodle-note" style="transform:rotate(-2deg)">the fun part! ↓</div>
      <h1>Enrol yourself as member #1</h1>
      <p>Print this and stick it by the till. Right now — scan it with your own phone to make sure it works. (Prototype: tap the button.)</p>
      <div class="qrbox wob">${qrSVG(180)}<div class="qrname">${esc(S.bizName)||'Your shop'} · ${esc(S.tierName)}</div></div>
      <div style="margin-top:22px"><button class="btn go" onclick="set('step',5)">📱 Simulate my phone scanning</button></div>
    </div>`;
  if(S.step===5) return `<div class="live">
      <p class="doodle-note" style="transform:rotate(-1.5deg);margin-bottom:10px">this is what YOUR customer sees — no app, no download</p>
      <div class="portal"><div class="phone"><div class="notch"></div>${cardHTML(true)}
        <div style="text-align:center;margin-top:14px">
          <div style="font-size:12px;color:#777;margin-bottom:8px">Enter your phone number to join</div>
          <input style="width:100%;padding:11px;border:2.5px solid var(--line);border-radius:12px" value="+60 12-345 6789" readonly>
          <button class="btn go" style="width:100%;margin-top:10px" onclick="S.doneAt=Date.now();set('step',6)">Join ${esc(S.tierName)}</button>
        </div></div></div>
    </div>`;
  if(S.step===6){
    const s = Math.floor(((S.doneAt||Date.now()) - (S.startedAt||Date.now()))/1000);
    const t = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    return `<div class="live">
      <div class="confetti">🎉</div>
      <h1>You're live. Member #1: you.</h1>
      <div class="bigtime">${t}</div>
      <p>Setup time — the claim on the tin is 15:00. Your QR poster is ready to print, your portal is live, and every scan from here is a real member.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn">🖨️ Print QR poster</button>
        <button class="btn ghost" onclick="set('step',0)">↺ Restart prototype</button>
      </div></div>`;
  }
  return '';
}

/* ------------ VARIANT A ------------ */
function renderA(root){
  if(S.step>=4){ root.innerHTML = liveHTML(); return; }
  root.innerHTML = `<div id="vA">
    <aside class="side">
      <div class="brand">membership<span class="doodle">.my</span></div>
      <div class="sub">Set up your program — no sales call, no manual.</div>
      <ul class="check">
        ${STEPS.map((st,i)=>`<li class="${i===S.step?'cur':''} ${i<S.step?'done':''}" onclick="${i<=S.step?`set('step',${i})`:''}">
          <span class="tick">${i<S.step?'✓':st.icon}</span>
          <span><b>${st.t}</b><small>${st.s}</small></span></li>`).join('')}
      </ul>
      <div class="prog">${S.step} of 5 done<div class="bar"><i style="width:${S.step/5*100}%"></i></div></div>
    </aside>
    <div class="main">
      <div class="panel wob">
        <h2>${STEPS[S.step].t}</h2><div class="hint">${STEPS[S.step].s}</div>
        ${stepFields(S.step)}
        <div style="display:flex;gap:10px;margin-top:20px">
          ${S.step>0?`<button class="btn ghost" onclick="set('step',${S.step-1})">Back</button>`:''}
          <button class="btn ${S.step===3?'go':''}" onclick="set('step',${S.step+1})">${S.step===3?'Go live →':'Next'}</button>
        </div>
      </div>
      <div class="prevwrap">
        <div class="doodle-note prevnote">← your members see this, live</div>
        <div class="livepreview">${cardHTML(false)}</div>
      </div>
    </div></div>`;
  bindInputs(root);
}

/* ------------ VARIANT B ------------ */
const B_TITLES = [
  ['What\'s your place called?','This goes at the top of your members\' card.'],
  ['Make it look like you','Logo, colour, cover — swap them any time.'],
  ['Name your first tier','"Kopi Club" beats "Tier 1". Trust us.'],
  ['What do regulars unlock?','One reward is enough to launch.']
];
function renderB(root){
  if(S.step>=4){ root.innerHTML = liveHTML(); return; }
  root.innerHTML = `<div id="vB">
    <div class="dots">${STEPS.map((_,i)=>`<span class="dot ${i<S.step?'done':i===S.step?'cur':''}"></span>`).join('')}</div>
    <div class="stepno">step ${S.step+1} of 5</div>
    <h1>${B_TITLES[S.step][0]}</h1>
    <div class="hint">${B_TITLES[S.step][1]}</div>
    <div class="stage wob2" style="padding:22px">${stepFields(S.step)}</div>
    <div class="navrow">
      ${S.step>0?`<button class="btn ghost" onclick="set('step',${S.step-1})">← Back</button>`:''}
      <button class="btn ${S.step===3?'go':''}" onclick="set('step',${S.step+1})">${S.step===3?'Go live →':'Continue →'}</button>
    </div></div>`;
  bindInputs(root);
}

/* ------------ VARIANT C ------------ */
function renderC(root){
  if(S.step>=4){ root.innerHTML = liveHTML(); return; }
  root.innerHTML = `<div id="vC">
    <h1>This is your members' card.<br>Fill it in.</h1>
    <div class="lead">No steps, no forms — tap anything on the card to change it. When it looks right, go live.</div>
    <div class="canvas">
      <div class="ann a1"><svg width="60" height="30" viewBox="0 0 60 30" fill="none"><path d="M55 25 C40 25 20 20 5 5" stroke="#FF6B5E" stroke-width="2.5" stroke-linecap="round"/><path d="M12 3 L5 5 L8 12" stroke="#FF6B5E" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>tap the cover to change the vibe</div>
      <div class="ann a2">tap the circle for your logo<svg width="60" height="26" viewBox="0 0 60 26" fill="none" style="margin-left:auto"><path d="M5 5 C25 8 40 15 55 22" stroke="#FF6B5E" stroke-width="2.5" stroke-linecap="round"/><path d="M48 24 L55 22 L51 15" stroke="#FF6B5E" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></div>
      <div class="ann a3">dashed lines = just type on them</div>
      <div class="bigcard">
        <div class="cov" style="background:${S.color}22" onclick="cycleCover()">${S.cover}</div>
        <div class="bod">
          <div class="lg" onclick="cycleLogo()">${S.logo}</div>
          <input class="inline nm" data-k="bizName" value="${esc(S.bizName)}" placeholder="Type your business name">
          <div class="row"><span class="lab">Tier</span><input class="inline" data-k="tierName" value="${esc(S.tierName)}"></div>
          <div class="row"><span class="lab">Earning</span><input class="inline" type="number" min="1" data-k="earn" value="${S.earn}" style="max-width:70px"><span style="font-size:13px">pt / RM1</span></div>
          <div class="row"><span class="lab">Reward</span><input class="inline" data-k="rewardName" value="${esc(S.rewardName)}"></div>
          <div class="row"><span class="lab">Costs</span><input class="inline" type="number" min="0" data-k="rewardPts" value="${S.rewardPts}" style="max-width:90px"><span style="font-size:13px">pts</span></div>
          <div class="row"><span class="lab">Colour</span><div class="swatches" style="margin:0">${COLORS.map(c=>`<button class="swatch ${S.color===c?'on':''}" style="background:${c};width:28px;height:28px" onclick="set('color','${c}')"></button>`).join('')}</div></div>
        </div>
      </div>
    </div>
    <div class="gorow">
      <span class="doodle-note" style="transform:rotate(-2deg)">looks good? →</span>
      <button class="btn go" onclick="set('step',4)">Go live with this card</button>
    </div></div>`;
  bindInputs(root);
}
function cycleCover(){ set('cover', COVERS[(COVERS.indexOf(S.cover)+1)%COVERS.length]); }
function cycleLogo(){ set('logo', LOGOS[(LOGOS.indexOf(S.logo)+1)%LOGOS.length]); }

/* ------------ switcher ------------ */
const VARIANTS = [
  ['A','Checklist & Canvas', renderA],
  ['B','One Thing at a Time', renderB],
  ['C','Fill the Card', renderC]
];
let VIDX = (()=>{ try{ const v=new URLSearchParams(location.search).get('variant')||'A';
  return Math.max(0, VARIANTS.findIndex(x=>x[0]===v)); }catch(e){ return 0; } })();
function currentVariant(){ return VIDX; }
function gotoVariant(i){
  VIDX = (i + VARIANTS.length) % VARIANTS.length;
  try{ history.replaceState(null,'', '?variant='+VARIANTS[VIDX][0]); }catch(e){ /* sandboxed preview blocks URL writes — in-memory switch still works */ }
  render();
}
function render(){
  const i = currentVariant();
  document.getElementById('vlabel').textContent = VARIANTS[i][0]+' — '+VARIANTS[i][1];
  VARIANTS[i][2](document.getElementById('app'));
}
document.getElementById('prev').onclick = ()=>gotoVariant(currentVariant()-1);
document.getElementById('next').onclick = ()=>gotoVariant(currentVariant()+1);
document.addEventListener('keydown', e=>{
  const tag = document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||document.activeElement.isContentEditable) return;
  if(e.key==='ArrowLeft') gotoVariant(currentVariant()-1);
  if(e.key==='ArrowRight') gotoVariant(currentVariant()+1);
});
render();
</script>
</body>
</html>
